<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Garage</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="text-center p-4">
    <h1>Garage of Luxury </h1>
    <p class="text-secondary">Select a car to view stats</p>
</header>


<div class="container d-flex justify-content-center my-4">

    <div class="card car-card shadow-lg">

        <img src="vintage-rusted-car-on-transparent-background-free-png.webp" alt="Car1">

        <div class="card-body text-center">

            <h3>Hunk of Junk</h3>
            <p class="text-muted">this car is so old and broken</p>

            <div class="text-start">

                <div class="mb-2">Speed</div>
                <div class="progress mb-3">
                    <div class="progress-bar bg-info" style="width:80%"></div>
                </div>

                <div class="mb-2">Handling</div>
                <div class="progress mb-3">
                    <div class="progress-bar bg-info" style="width:70%"></div>
                </div>

                <div class="mb-2">Power</div>
                <div class="progress mb-3">
                    <div class="progress-bar bg-info" style="width:60%"></div>
                </div>

                <div class="mb-2">Drift</div>
                <div class="progress mb-3">
                    <div class="progress-bar bg-info" style="width:90%"></div>
                </div>

            </div>

        </div>
    </div>

</div>


<!-- CAR SELECT BAR -->
<div class="container mb-5">

    <div class="d-flex flex-wrap justify-content-center gap-2 car-nav">

        <button class="btn btn-outline-dark">Hunk of Junk</button>
        <button class="btn btn-outline-dark">Car2</button>
        <button class="btn btn-outline-dark">Car3</button>
        <button class="btn btn-outline-dark">Car4</button>
        <button class="btn btn-outline-dark">Car5</button>
        <button class="btn btn-outline-dark">Car6</button>

    </div>

</div>

</body>
</html>
