<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Garage</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="text-center p-4">
    <h1>Sunset Garage</h1>
    <p class="text-secondary">Select a car to view specs</p>
</header>

<!-- CAR DISPLAY -->
<div class="container d-flex justify-content-center my-4">

    <div class="card car-card shadow-lg">

        <img src="vintage-rusted-car-on-transparent-background-free-png.webp" alt="car image">

        <div class="card-body text-center">

            <h3>Hunk of Junk</h3>
            <p class="text-muted">Specs appear here</p>

            <div class="text-start mt-3">

                <div class="mb-1">Horsepower</div>
                <div class="progress mb-2">
                    <div class="progress-bar bg-info"></div>
                </div>

                <div class="mb-1">Seating</div>
                <div class="progress mb-2">
                    <div class="progress-bar bg-info"></div>
                </div>

                <div class="mb-1">Fuel Type</div>
                <div class="progress mb-2">
                    <div class="progress-bar bg-info"></div>
                </div>

                <div class="mb-1">Price Scale</div>
                <div class="progress mb-2">
                    <div class="progress-bar bg-info"></div>
                </div>

            </div>

        </div>
    </div>

</div>

<!-- BUTTON SELECTOR -->
<div class="container mb-5">

    <div class="d-flex flex-wrap justify-content-center gap-2 car-nav">

        <button class="btn btn-outline-dark">Tesla Model S</button>
        <button class="btn btn-outline-dark">Ford F-150</button>
        <button class="btn btn-outline-dark">Toyota RAV4</button>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
